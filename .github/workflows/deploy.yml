name: 🚀 Deploy to server on push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload & Run Remote Commands
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Install deps & build
        run: |
          npm ci
          npm run build

      - name: 📤 Upload project (excluding src/)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          source: "app,public,scripts,prisma,package.json"
          target: "shop/backend"
          overwrite: true

      - name: 🧠 Run post-deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            cd shop/backend
            npm i --omit=dev
            pm2 describe shop > /dev/null \
              && pm2 restart shop \
              || pm2 start app/index.js --name shop
            pm2 save
            npm run migrate
